name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: write
      id-token: write
    defaults:
      run:
        # Windows PowerShell 5.1 provides the .NET Framework C# compiler used by build.ps1.
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      - name: Install Inno Setup 6.5.2 or later
        run: |
          $found = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { New-Object Version $_.VersionInfo.FileMajorPart, $_.VersionInfo.FileMinorPart, $_.VersionInfo.FileBuildPart } |
            Sort-Object -Descending | Select-Object -First 1
          if ($found -and $found -ge [Version]'6.5.2') {
            Write-Output "Using Inno Setup $found"
          } else {
            choco upgrade innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed.' }
          }

      - name: Build, run unit tests, and build the installer and Store package
        env:
          # Public Store identity values from Partner Center (Settings > Secrets and variables > Actions > Variables).
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          .\build.ps1 -Test -Installer -Package -PackageIdentityName $env:STORE_IDENTITY_NAME `
            -PackagePublisher $env:STORE_PUBLISHER -PackagePublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path bin\MD301Plus.exe).ProviderPath).ProductVersion
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in src\AssemblyInfo.cs."
          }

      - name: Package portable app and SHA-256 checksums
        run: |
          Compress-Archive -Path bin\MD301Plus.exe, bin\MD301Plus.exe.config -DestinationPath bin\MD301Plus-Portable.zip -CompressionLevel Optimal
          $assets = @('bin\MD301Plus-Setup.exe', 'bin\MD301Plus-Portable.zip')
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            '{0}  {1}' -f $hash, (Split-Path -Leaf $asset)
          }
          $checksumFile = Join-Path $PWD 'bin\MD301Plus-SHA256.txt'
          [System.IO.File]::WriteAllLines($checksumFile, $checksums, [System.Text.Encoding]::ASCII)
          Get-Content -LiteralPath $checksumFile

      - name: Test the installer
        run: .\tests\Installer.Tests.ps1 -Setup bin\MD301Plus-Setup.exe

      - name: Test the Store package
        run: .\tests\Package.Tests.ps1 -Package bin\MD301Plus.msix

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            bin/MD301Plus-Setup.exe
            bin/MD301Plus-Portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: MD301Plus-Release
          path: |
            bin/MD301Plus-Setup.exe
            bin/MD301Plus-Portable.zip
            bin/MD301Plus-SHA256.txt
          if-no-files-found: error

      # Unsigned on purpose: upload it to Partner Center, which signs it for the Microsoft Store.
      - uses: actions/upload-artifact@v7
        with:
          name: MD301Plus-Store
          path: bin/MD301Plus.msix
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MD301Plus-Release

      - name: Verify release artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify MD301Plus-Setup.exe --repo "$GITHUB_REPOSITORY"
          gh attestation verify MD301Plus-Portable.zip --repo "$GITHUB_REPOSITORY"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" MD301Plus-Setup.exe
          MD301Plus-Portable.zip MD301Plus-SHA256.txt
          --repo "$GITHUB_REPOSITORY"
          --title "MD301 Plus $GITHUB_REF_NAME"
          --notes "Download either the installer or portable ZIP below. Both are built and tested by GitHub Actions; SHA-256 checksums are attached. Windows may still show a SmartScreen warning because the files are not code-signed and are new or uncommon downloads."
          --generate-notes
          --verify-tag
